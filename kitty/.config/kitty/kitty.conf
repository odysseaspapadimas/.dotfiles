# Kitty configuration ported from the Ghostty/Catppuccin setup.

# Theme
include current-theme.conf

# Font (MesloLGS NF is not installed on this machine)
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9.0

# Window
window_padding_width 14
confirm_os_window_close 0
background_opacity 0.85
background_blur 30
hide_window_decorations yes

# Cursor and shell integration
# Use Fish explicitly so new Kitty windows do not inherit a stale login-session SHELL.
shell /usr/bin/fish
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Keep a compact tab bar visible at the bottom
tab_bar_min_tabs 1
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Clipboard
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Preserve Ctrl+Arrow sequences across all Kitty windows/splits
map ctrl+up send_text all \x1b[1;5A
map ctrl+down send_text all \x1b[1;5B
map ctrl+right send_text all \x1b[1;5C
map ctrl+left send_text all \x1b[1;5D

# Integration
allow_remote_control yes
enable_audio_bell no
