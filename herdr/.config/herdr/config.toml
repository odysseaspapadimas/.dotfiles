onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
# Catppuccin Macchiato-inspired overrides.
panel_bg = "#24273a"
accent = "#c6a0f6"
blue = "#8aadf4"
green = "#a6da95"
red = "#ed8796"
yellow = "#eed49f"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
previous_tab = "prefix+p"

[ui]
accent = "blue"
pane_gaps = true
pane_outer_borders = true
pane_scrollbars = false
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
window_title = "{hostname}: {workspace}"

# Custom agent-sidebar settings.
mobile_width_threshold = 80
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
sidebar_width = 30
sidebar_min_width = 22
sidebar_max_width = 40

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "state_icon", bold = true },
    { token = "agent", fg = "#c6a0f6", bold = true },
    { token = "state_text", dim = true },
  ],
  [
    { token = "workspace", fg = "#8aadf4" },
    { token = "tab", dim = true },
  ],
]

[ui.sidebar.agents.rows_by_agent]
pi = [
  [
    { token = "state_icon", bold = true },
    { token = "agent", fg = "#c6a0f6", bold = true },
    { token = "state_text", dim = true },
  ],
  ["workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[experimental]
# Let attached Kitty clients render inline images from Pi and other TUIs.
kitty_graphics = true
pane_history = false
switch_ascii_input_source_in_prefix = false

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" ports"
width = "82%"
height = "82%"
description = "development ports"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" project-scripts"
width = "82%"
height = "82%"
description = "project scripts"

[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" project-scratch"
width = "90%"
height = "90%"
description = "private project scratch"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" workspace-editor"
description = "focus workspace editor tab"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" workspace-editor --split"
description = "focus workspace editor split"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" workspace-git"
width = "90%"
height = "90%"
description = "Git status and history"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "/bin/sh \"$HOME/.config/herdr/popup-env\" drop"
width = "90%"
height = "90%"
description = "upload files"

[[keys.command]]
key = "prefix+comma"
type = "shell"
command = "python3 \"$HOME/.config/herdr/move-current-tab.py\" left"
description = "move current tab left"

[[keys.command]]
key = "prefix+period"
type = "shell"
command = "python3 \"$HOME/.config/herdr/move-current-tab.py\" right"
description = "move current tab right"

[[keys.command]]
key = "prefix+shift+comma"
type = "shell"
command = "python3 \"$HOME/.config/herdr/move-current-workspace.py\" up"
description = "move current workspace up"

[[keys.command]]
key = "prefix+shift+period"
type = "shell"
command = "python3 \"$HOME/.config/herdr/move-current-workspace.py\" down"
description = "move current workspace down"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "edi.layout-tools.equalize"
description = "equalize pane splits"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "edi.layout-tools.reshape-main-left"
description = "focused pane main-left"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "edi.layout-tools.reshape-main-grid"
description = "focused pane main-left with grid"
